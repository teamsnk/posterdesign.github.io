<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Chatter - Secure communication system"
    >

    <title>Chatter</title>

    <!-- =====================================================
         FONT
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         CHATTER CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="chat.css"
    >

</head>


<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <!-- Sidebar Header -->

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">
                    C
                </div>

                <div>

                    <div class="brand-name">
                        Chatter
                    </div>

                    <div class="brand-status">
                        ● Secure Communication
                    </div>

                </div>

            </div>


            <button
                class="header-btn"
                type="button"
                title="New conversation"
                aria-label="New conversation"
            >
                +
            </button>

        </div>


        <!-- Search -->

        <div class="search-box">

            <div class="search-wrap">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="search"
                    class="search-input"
                    placeholder="Search conversations..."
                    autocomplete="off"
                    aria-label="Search conversations"
                >

            </div>

        </div>


        <!-- Conversation List -->

        <div class="conversation-list">
            <!-- JavaScript will render conversations -->
        </div>

    </aside>


    <!-- =====================================================
         CHAT AREA
         ===================================================== -->

    <main class="chat">

        <!-- Chat Header -->

        <header class="chat-header">

            <div class="chat-user">

                <button
                    class="mobile-back"
                    type="button"
                    aria-label="Back"
                    title="Back"
                >
                    ←
                </button>


                <div class="chat-avatar">
                    SA
                </div>


                <div class="chat-user-info">

                    <div class="chat-user-name">
                        System Admin
                    </div>

                    <div class="chat-user-status">
                        Online
                    </div>

                </div>

            </div>


            <!-- Chat Actions -->

            <div class="chat-actions">

                <!-- Voice Call -->

                <button
                    class="chat-action"
                    type="button"
                    data-call-type="voice"
                    title="Voice Call"
                    aria-label="Voice Call"
                >
                    📞
                </button>


                <!-- Video Call -->

                <button
                    class="chat-action"
                    type="button"
                    data-call-type="video"
                    title="Video Call"
                    aria-label="Video Call"
                >
                    📹
                </button>


                <!-- Screen Share -->

                <button
                    class="chat-action"
                    type="button"
                    data-call-type="screen"
                    title="Share Screen"
                    aria-label="Share Screen"
                >
                    🖥️
                </button>


                <!-- More -->

                <button
                    class="chat-action"
                    type="button"
                    title="More"
                    aria-label="More options"
                >
                    ⋮
                </button>

            </div>

        </header>


        <!-- =================================================
             MESSAGES
             ================================================= -->

        <section
            class="messages"
            aria-label="Messages"
        >
            <!-- JavaScript renders messages -->
        </section>


        <!-- =================================================
             TYPING INDICATOR
             ================================================= -->

        <div class="typing">

            <div class="typing-inner">
                <span>Typing</span>

                <span class="typing-dots">

                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>

                </span>
            </div>

        </div>


        <!-- =================================================
             SYSTEM MESSAGE
             ================================================= -->

        <div
            class="system-message"
            role="status"
            aria-live="polite"
        ></div>


        <!-- =================================================
             COMPOSER
             ================================================= -->

        <div class="composer">

            <!-- Composer Tools -->

            <div class="composer-tools">

                <!-- File -->

                <button
                    class="tool-btn"
                    type="button"
                    data-file-action="file"
                    title="Attach file"
                    aria-label="Attach file"
                >
                    📎
                </button>


                <!-- Image -->

                <button
                    class="tool-btn"
                    type="button"
                    data-file-action="image"
                    title="Send image"
                    aria-label="Send image"
                >
                    🖼️
                </button>


                <!-- Camera -->

                <button
                    class="tool-btn"
                    type="button"
                    data-file-action="camera"
                    title="Camera preview"
                    aria-label="Camera preview"
                >
                    📷
                </button>

            </div>


            <!-- Message Input -->

            <div class="message-input-wrap">

                <textarea
                    class="message-input"
                    rows="1"
                    placeholder="Write a message..."
                    autocomplete="off"
                    aria-label="Write a message"
                ></textarea>


                <button
                    class="emoji-btn"
                    type="button"
                    title="Emoji"
                    aria-label="Insert emoji"
                >
                    😊
                </button>

            </div>


            <!-- Send -->

            <button
                class="send-btn"
                type="button"
                title="Send message"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </main>

</div>


<!-- =========================================================
     HIDDEN FILE INPUTS
     ========================================================= -->

<input
    id="fileInput"
    type="file"
    hidden
>


<input
    id="imageInput"
    type="file"
    accept="image/*"
    hidden
>


<!-- =========================================================
     CALL / LIVE PREVIEW MODAL
     ========================================================= -->

<div
    class="modal-backdrop"
    aria-hidden="true"
>

    <div
        class="call-modal"
        role="dialog"
        aria-modal="true"
        aria-label="Live communication"
    >

        <!-- Call Header -->

        <div class="call-top">

            <div>

                <div class="call-title">
                    Live Communication
                </div>

                <div class="call-status">
                    Connecting...
                </div>

            </div>


            <button
                class="call-close"
                type="button"
                data-close-call
                title="Close"
                aria-label="Close"
            >
                ✕
            </button>

        </div>


        <!-- Preview -->

        <div class="call-preview">

            <!-- Remote / Screen Preview -->

            <video
                class="remote-video"
                autoplay
                playsinline
            ></video>


            <!-- Empty State -->

            <div class="call-empty">

                <div class="call-empty-icon">
                    🔐
                </div>

                <div class="call-empty-title">
                    Secure Live Session
                </div>

                <div class="call-empty-text">
                    Live camera, microphone or screen
                    sharing can be used only after
                    explicit user permission.
                    No recording is performed.
                </div>

            </div>


            <!-- Local Camera -->

            <video
                class="local-video"
                autoplay
                playsinline
                muted
            ></video>

        </div>


        <!-- Call Controls -->

        <div class="call-controls">

            <!-- Microphone -->

            <button
                class="call-control"
                type="button"
                data-call-control="microphone"
                title="Microphone"
                aria-label="Microphone"
            >
                🎙️
            </button>


            <!-- Camera -->

            <button
                class="call-control"
                type="button"
                data-call-control="camera"
                title="Camera"
                aria-label="Camera"
            >
                📷
            </button>


            <!-- Screen Share -->

            <button
                class="call-control"
                type="button"
                data-call-control="screen"
                title="Share screen"
                aria-label="Share screen"
            >
                🖥️
            </button>


            <!-- Preview Mute -->

            <button
                class="call-control"
                type="button"
                data-call-control="mute-preview"
                title="Mute preview"
                aria-label="Mute preview"
            >
                🔇
            </button>


            <!-- End -->

            <button
                class="call-control end"
                type="button"
                data-call-control="end"
                title="End session"
                aria-label="End session"
            >
                ☎
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     CHATTER JAVASCRIPT
     ========================================================= -->

<script
    src="chat.js"
    defer
></script>


</body>
</html>
