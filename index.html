<script>

(function () {

    const BANNER_KEY =
        "doctorPosterBannerStatus";

    const DEFAULT_BANNERS = {
        banner1: true,
        banner2: true
    };


    function getBannerStatus() {

        try {

            const saved =
                localStorage.getItem(BANNER_KEY);

            if (!saved) {

                return {
                    ...DEFAULT_BANNERS
                };

            }

            const parsed =
                JSON.parse(saved);

            return {
                ...DEFAULT_BANNERS,
                ...parsed
            };

        } catch (error) {

            console.error(
                "Unable to read banner settings:",
                error
            );

            return {
                ...DEFAULT_BANNERS
            };

        }

    }


    /*
     * BANNER MANAGEMENT → HOMEPAGE CONNECTION
     *
     * Banner 1 / Banner 2 status is controlled
     * from Admin Panel → Banner Management.
     */

    function applyBannerStatus() {

        const banners =
            getBannerStatus();


        /*
         * Future homepage banner slots
         *
         * These IDs will be used when the actual
         * Banner 1 / Banner 2 designs are connected.
         */

        const banner1 =
            document.getElementById("homepageBanner1");

        const banner2 =
            document.getElementById("homepageBanner2");


        if (banner1) {

            banner1.style.display =
                banners.banner1 === false
                    ? "none"
                    : "";

        }


        if (banner2) {

            banner2.style.display =
                banners.banner2 === false
                    ? "none"
                    : "";

        }


        /*
         * If both banners are disabled,
         * hide the complete banner area.
         */

        const bannerArea =
            document.getElementById(
                "homepageBannerArea"
            );


        if (bannerArea) {

            const hasActiveBanner =
                banners.banner1 !== false ||
                banners.banner2 !== false;


            bannerArea.style.display =
                hasActiveBanner
                    ? ""
                    : "none";

        }

    }


    /*
     * INITIAL LOAD
     */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            applyBannerStatus
        );

    } else {

        applyBannerStatus();

    }


    /*
     * LIVE SYNC
     *
     * Admin Banner Management changes
     * will update Homepage automatically.
     */

    window.addEventListener(
        "storage",
        function (event) {

            if (
                event.key === BANNER_KEY
            ) {

                applyBannerStatus();

            }

        }
    );


})();

</script>
